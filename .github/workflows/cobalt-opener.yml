name: Build Cobalt Opener
on:
  workflow_dispatch:
  push:
    paths: ["cobalt-opener/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        working-directory: cobalt-opener
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CobaltOpener
          path: cobalt-opener/app/build/outputs/apk/release/*.apk
